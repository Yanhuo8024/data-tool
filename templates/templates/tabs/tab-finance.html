            <option value="DCOILWTICO">WTI原油（DCOILWTICO）</option>

            <option value="GOLDAMGBD228NLBM">伦敦金定盘价（GOLDAMGBD228NLBM）</option>
          </optgroup>
        </select>
      </div>
      <div class="fg">
        <label>关键词（仅检索用）</label>
        <input id="fred-query" placeholder="GDP / 利率 / CPI ...">
      </div>
      <div class="fg">
        <label>开始日期</label>
        <input id="fred-start" type="date" placeholder="2020-01-01">
      </div>
      <div class="fg">
        <label>结束日期</label>
        <input id="fred-end" type="date" placeholder="2024-12-31">
      </div>
      <div class="fg">
        <label>CSV 文件名</label>
        <input id="fred-name" placeholder="fred_data.csv">
      </div>
    </div>
    <div class="bgrp">
      <button class="btn btn-p" onclick="doFred()">FRED 获取</button>
      <span id="fred-stat" style="font-size:13px;color:var(--ink-subtle)"></span>
    </div>
  </div>

  <div class="card hide" id="fi-res-card">
    <div class="c-head">
      <div class="c-title"></div>
      <button class="btn btn-g btn-sm" onclick="dlFinance()">CSV</button>
    </div>
    <div class="stats" id="fi-stats"></div>
    <div id="fi-preview" style="margin-top:16px;overflow-x:auto;"></div>
  </div>

  <!-- ================== Text-to-SQL 引擎 ================== -->
  <div class="card" style="margin-top:28px;">
    <div class="c-head">
      <div class="c-title">Text-to-SQL 引擎</div>
      <div class="c-sub">连接数据库 · 自然语言转 SQL · 自动图表</div>
    </div>
    <div class="grid">
      <div class="fg"><label>数据库类型</label>
        <select id="sql-db-type">
          <option value="sqlite">SQLite</option>
          <option value="mysql">MySQL</option>
          <option value="postgresql">PostgreSQL</option>
        </select>
      </div>
      <div class="fg"><label>主机</label><input id="sql-host" value="localhost"></div>
      <div class="fg"><label>端口</label><input id="sql-port" type="number" value="3306"></div>
      <div class="fg"><label>数据库名</label><input id="sql-database" placeholder="database_name"></div>
    </div>
    <div class="grid" style="margin-top:8px;">
      <div class="fg"><label>用户名</label><input id="sql-user" value="root"></div>
      <div class="fg"><label>密码</label><input id="sql-password" type="password" placeholder="password"></div>
      <div class="fg"><label>SQLite路径</label><input id="sql-sqlite-path" placeholder="output/data.db"></div>
      <div class="fg"><label>&nbsp;</label><button class="btn btn-p btn-sm" onclick="sqlConnect()">连接</button></div>
    </div>
    <div id="sql-schema-box" style="display:none;margin-top:12px;">
      <div style="color:#888;font-size:12px;margin-bottom:8px;">数据库 Schema：</div>
      <div id="sql-schema-content" style="background:rgba(0,0,0,0.2);border-radius:8px;padding:12px;max-height:150px;overflow-y:auto;font-family:monospace;font-size:12px;"></div>
    </div>
    <div id="sql-query-box" style="display:none;margin-top:12px;">
      <div class="fg s2"><label>自然语言查询</label>
        <textarea id="sql-nl-query" placeholder="如：统计上个月各省份的销售额" style="width:100%;min-height:60px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#fff;border-radius:8px;padding:8px;"></textarea>
      </div>
      <div class="bgrp" style="margin-top:8px;">
        <button class="btn btn-p" onclick="nlToSQL()">执行查询</button>
        <button class="btn btn-s" onclick="showManualSQL()">直接输入SQL</button>
      </div>
      <div id="sql-result" class="mt"></div>
      <div id="sql-chart"></div>
    </div>
  </div>
</div>
