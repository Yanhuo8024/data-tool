<!-- ======================== 股票筛选器 ======================== -->
<div id="tab-screen" class="sec">
  <style>
    #tab-screen .scr-wrap { display: flex; flex-direction: column; gap: 16px; }
    #tab-screen .scr-card {
      background: var(--card-bg, rgba(20, 28, 44, .88));
      border: 1px solid var(--glass-border, rgba(148, 163, 210, .14));
      border-radius: 16px;
      padding: 20px;
    }
    #tab-screen .scr-title {
      display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
      margin-bottom: 6px;
    }
    #tab-screen .scr-title h2 {
      margin: 0; font-size: 18px; font-weight: 800; letter-spacing: .02em;
    }
    #tab-screen .scr-title .sub {
      font-size: 12.5px; color: var(--ink-subtle, #8b9bb8);
    }
    #tab-screen .scr-sec-label {
      font-size: 11px; font-weight: 700; letter-spacing: .08em;
      color: var(--ink-subtle, #8b9bb8); text-transform: uppercase;
      margin: 4px 0 12px;
    }
    #tab-screen .scr-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px 16px;
    }
    #tab-screen .scr-field { grid-column: span 3; min-width: 0; }
    #tab-screen .scr-field.wide { grid-column: span 6; }
    #tab-screen .scr-field.full { grid-column: span 12; }
    #tab-screen .scr-field label {
      display: block; margin-bottom: 6px;
      font-size: 12px; font-weight: 650; color: var(--ink-subtle, #8b9bb8);
    }
    #tab-screen .scr-field input,
    #tab-screen .scr-field select {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--glass-border, rgba(148, 163, 210, .18));
      background: rgba(8, 12, 22, .55);
      color: var(--ink, #eef2ff);
      font-size: 13px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      box-sizing: border-box;
    }
    #tab-screen .scr-field input:focus {
      border-color: var(--accent, #5b8cff);
      box-shadow: 0 0 0 3px rgba(91, 140, 255, .15);
    }
    #tab-screen .scr-range {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }
    #tab-screen .scr-range .sep {
      color: var(--ink-tertiary, #6b7a90);
      font-size: 12px;
      user-select: none;
    }
    #tab-screen .scr-actions {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin-top: 4px;
    }
    #tab-screen .scr-btn {
      height: 40px; padding: 0 20px; border-radius: 10px;
      font-size: 13.5px; font-weight: 700; cursor: pointer;
      border: 1px solid transparent; transition: filter .15s, transform .1s;
    }
    #tab-screen .scr-btn:active { transform: translateY(1px); }
    #tab-screen .scr-btn.primary {
      background: linear-gradient(135deg, var(--accent, #5b8cff), #3d6fe0);
      color: #fff;
      box-shadow: 0 8px 20px rgba(91, 140, 255, .28);
    }
    #tab-screen .scr-btn.primary:hover { filter: brightness(1.08); }
    #tab-screen .scr-btn.ghost {
      background: rgba(255, 255, 255, .05);
      border-color: var(--glass-border, rgba(148, 163, 210, .2));
      color: var(--ink-2, #c8d2e8);
    }
    #tab-screen .scr-btn.ghost:hover {
      background: rgba(255, 255, 255, .09);
      color: var(--ink);
    }
    #tab-screen .scr-hint {
      font-size: 11.5px; color: var(--ink-tertiary, #6b7a90); line-height: 1.6;
    }
    #tab-screen .scr-stat {
      font-size: 12.5px; color: var(--ink-subtle, #8b9bb8); min-height: 18px;
    }
    #tab-screen .scr-stat.busy { color: var(--accent, #5b8cff); }
    #tab-screen .scr-stat.ok { color: #2dd4a8; }

    #tab-screen .scr-res-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
    }
    #tab-screen .scr-res-head h3 {
      margin: 0; font-size: 15px; font-weight: 750;
    }
    #tab-screen .scr-table-wrap {
      overflow: auto;
      max-height: 520px;
      border: 1px solid var(--glass-border, rgba(148, 163, 210, .14));
      border-radius: 12px;
    }
    #tab-screen .scr-table-wrap table {
      border-collapse: collapse; width: 100%; font-size: 12.5px;
    }
    #tab-screen .scr-table-wrap th {
      position: sticky; top: 0; z-index: 1;
      background: rgba(18, 26, 43, .96);
      color: var(--ink-subtle, #8b9bb8);
      font-size: 11px; font-weight: 700; letter-spacing: .03em;
      text-align: left; padding: 10px 12px;
      border-bottom: 1px solid var(--glass-border, rgba(148, 163, 210, .18));
      white-space: nowrap;
    }
    #tab-screen .scr-table-wrap td {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(148, 163, 210, .08);
      color: var(--ink, #eef2ff);
      white-space: nowrap;
    }
    #tab-screen .scr-table-wrap tr:hover td {
      background: rgba(91, 140, 255, .06);
    }
    #tab-screen .scr-empty {
      padding: 28px; text-align: center; color: var(--ink-subtle, #8b9bb8); font-size: 13px;
    }
    #tab-screen .scr-chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    #tab-screen .scr-chip {
      font-size: 11px; padding: 4px 10px; border-radius: 999px;
      border: 1px solid var(--glass-border, rgba(148, 163, 210, .2));
      background: rgba(255, 255, 255, .03);
      color: var(--ink-subtle, #8b9bb8);
      cursor: pointer;
    }
    #tab-screen .scr-chip:hover {
      border-color: var(--accent, #5b8cff);
      color: var(--accent, #5b8cff);
      background: rgba(91, 140, 255, .1);
    }

    @media (max-width: 1100px) {
      #tab-screen .scr-field { grid-column: span 4; }
      #tab-screen .scr-field.wide { grid-column: span 6; }
    }
    @media (max-width: 720px) {
      #tab-screen .scr-field,
      #tab-screen .scr-field.wide { grid-column: span 12; }
      #tab-screen .scr-card { padding: 16px; }
    }
  </style>

  <div class="scr-wrap">
    <!-- 筛选条件 -->
    <div class="scr-card">
      <div class="scr-title">
        <h2>A 股筛选器</h2>
        <div class="sub">按 PE / ROE / 市值 / 行业 / 价格筛选，结果可导出 CSV</div>
      </div>
      <div class="scr-sec-label">筛选条件（留空表示不限）</div>

      <div class="scr-grid">
        <div class="scr-field">
          <label>市盈率 PE 范围</label>
          <div class="scr-range">
            <input id="s-pe-min" type="number" placeholder="最小" inputmode="decimal">
            <span class="sep">—</span>
            <input id="s-pe-max" type="number" placeholder="最大" inputmode="decimal">
          </div>
        </div>

        <div class="scr-field">
          <label>最低 ROE（%）</label>
          <input id="s-roe-min" type="number" placeholder="如 15" inputmode="decimal">
        </div>

        <div class="scr-field">
          <label>市值范围（亿元）</label>
          <div class="scr-range">
            <input id="s-mcap-min" type="number" placeholder="最小" inputmode="decimal">
            <span class="sep">—</span>
            <input id="s-mcap-max" type="number" placeholder="最大" inputmode="decimal">
          </div>
        </div>

        <div class="scr-field">
          <label>最高市净率 PB</label>
          <input id="s-pb-max" type="number" placeholder="如 5" inputmode="decimal">
        </div>

        <div class="scr-field">
          <label>股价范围（元）</label>
          <div class="scr-range">
            <input id="s-price-min" type="number" placeholder="最低" inputmode="decimal">
            <span class="sep">—</span>
            <input id="s-price-max" type="number" placeholder="最高" inputmode="decimal">
          </div>
        </div>

        <div class="scr-field">
          <label>最低涨跌幅（%）</label>
          <input id="s-change-min" type="number" placeholder="如 3 表示涨幅 ≥ 3%" inputmode="decimal">
        </div>

        <div class="scr-field wide">
          <label>行业关键词</label>
          <input id="s-industry" type="text" placeholder="如 半导体 / 医药 / 银行">
          <div class="scr-chip-row">
            <span class="scr-chip" onclick="var el=document.getElementById('s-industry'); if(el){el.value='半导体'; el.dispatchEvent(new Event('input'));}">半导体</span>
            <span class="scr-chip" onclick="var el=document.getElementById('s-industry'); if(el){el.value='医药'; el.dispatchEvent(new Event('input'));}">医药</span>
            <span class="scr-chip" onclick="var el=document.getElementById('s-industry'); if(el){el.value='银行'; el.dispatchEvent(new Event('input'));}">银行</span>
            <span class="scr-chip" onclick="var el=document.getElementById('s-industry'); if(el){el.value='新能源'; el.dispatchEvent(new Event('input'));}">新能源</span>
            <span class="scr-chip" onclick="var el=document.getElementById('s-industry'); if(el){el.value='白酒'; el.dispatchEvent(new Event('input'));}">白酒</span>
            <span class="scr-chip" onclick="var el=document.getElementById('s-industry'); if(el){el.value=''; el.dispatchEvent(new Event('input'));}">清空</span>
          </div>
        </div>
      </div>

      <div class="scr-actions">
        <button type="button" class="scr-btn primary" onclick="doScreen()">开始筛选</button>
        <button type="button" class="scr-btn ghost" onclick="resetScreen()">重置</button>
        <div class="scr-stat" id="screen-stat"></div>
      </div>
      <div class="scr-hint" style="margin-top:8px;">
        提示：首次筛选需加载约 5500 只 A 股数据，约需 10–20 秒；之后筛选会使用缓存，秒级返回。
      </div>
    </div>

    <!-- 快捷预设 -->
    <div class="scr-card">
      <div class="scr-sec-label">常用预设（点击填充条件）</div>
      <div class="scr-chip-row">
        <span class="scr-chip" onclick="scrPreset({pe_max:20,roe_min:15})">低估值高ROE</span>
        <span class="scr-chip" onclick="scrPreset({pe_max:30,change_min:3})">成长加速</span>
        <span class="scr-chip" onclick="scrPreset({pb_max:2,roe_min:10})">破净优选</span>
        <span class="scr-chip" onclick="scrPreset({mcap_min:500})">大盘蓝筹</span>
        <span class="scr-chip" onclick="scrPreset({mcap_max:100,roe_min:20})">小盘高成长</span>
        <span class="scr-chip" onclick="scrPreset({})">清空预设</span>
      </div>
    </div>

    <!-- 结果 -->
    <div class="scr-card hide" id="s-res-card">
      <div class="scr-res-head">
        <h3>筛选结果</h3>
        <div style="display:flex;gap:8px;align-items:center;">
          <span id="s-res-count" class="scr-stat"></span>
          <button type="button" class="scr-btn ghost" onclick="exportScreenCSV()">导出 CSV</button>
        </div>
      </div>
      <div class="scr-table-wrap" id="s-table"></div>
      <div class="scr-hint" style="margin-top:12px;">
        ⚠ 本结果为客观数据筛选，不构成投资建议，投资有风险，入市需谨慎。
      </div>
    </div>
  </div>

  <script>
    // 快捷预设：填充筛选条件（保留 doScreen/resetScreen 的字段 id）
    function scrPreset(map) {
      var fields = {
        pe_min: 's-pe-min', pe_max: 's-pe-max',
        roe_min: 's-roe-min',
        mcap_min: 's-mcap-min', mcap_max: 's-mcap-max',
        pb_max: 's-pb-max',
        price_min: 's-price-min', price_max: 's-price-max',
        change_min: 's-change-min', industry: 's-industry'
      };
      Object.keys(fields).forEach(function (k) {
        var el = document.getElementById(fields[k]);
        if (el) el.value = (map[k] === undefined || map[k] === null) ? '' : map[k];
      });
      var stat = document.getElementById('screen-stat');
      if (stat) {
        stat.textContent = map && Object.keys(map).length ? '已填充预设条件，点击「开始筛选」' : '已清空筛选条件';
        stat.className = 'scr-stat';
      }
    }
  </script>
</div>
