<!-- ======================== 股票筛选器 ======================== -->
<div id="tab-screen" class="sec">
  <div class="card">
    <div class="c-head">
      <div class="c-title">A股筛选器</div>
      <div class="c-sub">按 PE / ROE / 市值 / 行业 / 价格 筛选，结果可导出 CSV</div>
    </div>
    <div class="eyebrow">筛选条件（留空表示不限）</div>
    <div class="grid" style="grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));">
      <div class="fg"><label>市盈率 PE 范围</label><div class="flex gap"><input id="s-pe-min" placeholder="最小值" style="flex:1;"><input id="s-pe-max" placeholder="最大值" style="flex:1;"></div></div>
      <div class="fg"><label>最低 ROE (%)</label><input id="s-roe-min" placeholder="如 15"></div>
      <div class="fg"><label>市值范围 (亿)</label><div class="flex gap"><input id="s-mcap-min" placeholder="最小"><input id="s-mcap-max" placeholder="最大" style="flex:1;"></div></div>
      <div class="fg"><label>最高市净率 PB</label><input id="s-pb-max" placeholder="如 5"></div>
      <div class="fg"><label>股价范围</label><div class="flex gap"><input id="s-price-min" placeholder="最低"><input id="s-price-max" placeholder="最高" style="flex:1;"></div></div>
      <div class="fg"><label>最低涨跌幅 (%)</label><input id="s-change-min" placeholder="如 3 筛选涨幅大于3%"></div>
      <div class="fg"><label>行业关键词</label><input id="s-industry" placeholder="如 半导体 / 医药 / 银行"></div>
    </div>
    <div class="bgrp" style="margin-top:12px;">
      <button class="btn btn-p" onclick="doScreen()">开始筛选</button>
      <button class="btn btn-g btn-sm" onclick="resetScreen()" style="margin-left:6px;">重置</button>
    </div>
    <div id="s-stat" style="font-size:13px;color:var(--ink-subtle);margin-top:8px;"></div>
    <div style="font-size:11px;color:var(--ink-tertiary);margin-top:4px;">提示：首次筛选需加载约 5500 只 A 股数据，约需 10-20 秒</div>
  </div>

  <!-- 结果 -->
  <div class="card hide" id="s-res-card">
    <div class="c-head">
      <div class="c-title">筛选结果</div>
      <div class="flex gap">
        <button class="btn btn-g btn-sm" onclick="exportScreenCSV()">导出 CSV</button>
      </div>
    </div>
    <div id="s-res-count" style="font-size:13px;color:var(--ink-subtle);margin-bottom:12px;"></div>
    <div style="overflow-x:auto;" id="s-table"></div>
    <div style="font-size:11px;color:var(--ink-tertiary);margin-top:12px;padding:8px 0;">
      ⚠ 此分析不构成投资建议，投资有风险，入市需谨慎
    </div>
  </div>
</div>
