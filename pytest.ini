[pytest]
markers =
    network: 需要联网的测试（默认跳过，CI 仅在注入 AKSHARE_TOKEN 等情况下运行）
    slow: 长时间运行的测试（CI 默认跳过，本地按需启用）
    gpu: 需要 GPU 的测试（默认跳过）
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
    -p no:cacheprovider
    -m "not network and not slow and not gpu"
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning